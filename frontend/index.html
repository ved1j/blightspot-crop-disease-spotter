<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14301c">
<title>BlightSpot</title>
<style>
  :root {
    --bg: #f4f6f1; --card: #ffffff; --ink: #18221a; --muted: #5d6b60;
    --accent: #2f7d43; --accent-ink: #ffffff; --lesion: #e3325a; --line: #dfe5dc;
    --healthy: #2f7d43; --mild: #c99a12; --moderate: #e06a1b; --severe: #c8243f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1511; --card: #18211b; --ink: #e7eee8; --muted: #9aa99e;
      --accent: #4fae68; --accent-ink: #0b130d; --line: #26332a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 20px 0 8px; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--lesion); }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 16px; }
  .actions { display: grid; gap: 10px; }
  button, .btn {
    appearance: none; border: 0; border-radius: 12px; min-height: 52px; width: 100%;
    font: 600 1rem/1 inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: progress; }
  input[type=file] { display: none; }
  .status { color: var(--muted); font-size: .9rem; min-height: 1.3em; margin: 10px 0 0; text-align: center; }
  .error { color: var(--severe); }
  .verdict { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .badge { font-weight: 700; text-transform: capitalize; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: .9rem; }
  .big { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; }
  .meter { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 14px; }
  .meter > div { height: 100%; width: 0; transition: width .5s ease; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats div { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
  .stats b { display: block; font-size: 1.15rem; }
  .stats small { color: var(--muted); font-size: .75rem; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .tabs button { min-height: 36px; width: auto; padding: 0 14px; font-size: .85rem; white-space: nowrap; flex: none; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .tabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .viewer img { width: 100%; aspect-ratio: 1; border-radius: 12px; image-rendering: pixelated; display: block; background: #000; }
  .legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .gt { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 18px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Blight<span>Spot</span></h1>
    <p class="sub">Snap or upload a leaf photo to map lesion patches.</p>
  </header>

  <section class="card actions">
    <label class="btn primary" for="camera">📷&nbsp; Take photo</label>
    <input id="camera" type="file" accept="image/*" capture="environment">
    <label class="btn secondary" for="gallery">🖼️&nbsp; Choose from gallery</label>
    <input id="gallery" type="file" accept="image/*">
    <button id="sample" class="secondary">🌿&nbsp; Try a synthetic leaf</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section id="results" class="card" hidden>
    <div class="verdict">
      <div>
        <div class="big" id="pct">0%</div>
        <small class="sub">of leaf area affected</small>
      </div>
      <span class="badge" id="badge">healthy</span>
    </div>
    <div class="meter"><div id="meter"></div></div>
    <div class="stats">
      <div><b id="count">0</b><small>lesions</small></div>
      <div><b id="lesionPx">0</b><small>lesion px</small></div>
      <div><b id="leafPx">0</b><small>leaf px</small></div>
    </div>
  </section>

  <section id="viewerCard" class="card viewer" hidden>
    <div class="tabs" id="tabs"></div>
    <img id="view" alt="Segmentation result">
    <div class="legend">
      <span><i style="background:#46aa50"></i>leaf</span>
      <span><i style="background:#eb325a"></i>lesion</span>
      <span><i style="background:#fff;border:1px solid #999"></i>leaf outline</span>
    </div>
    <p class="gt" id="gt" hidden></p>
  </section>

  <footer id="disclaimer">
    Demo trained only on synthetic leaves. Not an agronomic diagnostic tool.
  </footer>
</main>

<script>
  const API = new URLSearchParams(location.search).get("api") || "";
  const $ = (id) => document.getElementById(id);
  const LABELS = { overlay: "Overlay", original: "Original", mask: "Mask", ground_truth: "Ground truth" };
  const COLORS = { healthy: "var(--healthy)", mild: "var(--mild)", moderate: "var(--moderate)", severe: "var(--severe)" };
  let images = {};

  function busy(on, msg = "") {
    for (const el of document.querySelectorAll(".actions button, .actions label")) {
      el.toggleAttribute("disabled", on);
      el.style.pointerEvents = on ? "none" : "";
    }
    $("status").className = "status";
    $("status").textContent = msg;
  }

  function fail(msg) {
    busy(false);
    $("status").className = "status error";
    $("status").textContent = msg;
  }

  // Phone photos can be 10+ MB; shrink client-side before uploading.
  async function downscale(file, max = 768) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
    if (!bmp) return file;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob((b) => res(b || file), "image/jpeg", 0.9));
  }

  async function upload(file) {
    if (!file) return;
    busy(true, "Analyzing leaf…");
    try {
      const body = new FormData();
      body.append("file", await downscale(file), "leaf.jpg");
      const r = await fetch(`${API}/analyze`, { method: "POST", body });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      render(await r.json());
    } catch (e) { fail(`Couldn't analyze: ${e.message}`); }
  }

  async function sample() {
    busy(true, "Growing a synthetic leaf…");
    try {
      const r = await fetch(`${API}/sample`);
      if (!r.ok) throw new Error(r.statusText);
      render(await r.json());
    } catch (e) { fail(`Couldn't load sample: ${e.message}`); }
  }

  function render(d) {
    busy(false, "");
    $("results").hidden = $("viewerCard").hidden = false;
    $("pct").textContent = `${d.affected_pct.toFixed(1)}%`;
    $("badge").textContent = d.severity;
    $("badge").style.background = COLORS[d.severity] || "var(--muted)";
    $("meter").style.background = COLORS[d.severity] || "var(--muted)";
    $("meter").style.width = `${Math.min(100, d.affected_pct * 3)}%`; // 33%+ fills the bar
    $("count").textContent = d.lesion_count;
    $("lesionPx").textContent = d.lesion_pixels.toLocaleString();
    $("leafPx").textContent = d.leaf_pixels.toLocaleString();
    $("disclaimer").textContent = d.disclaimer;

    const gt = d.ground_truth;
    $("gt").hidden = !gt;
    if (gt) $("gt").textContent =
      `Ground truth: ${gt.affected_pct.toFixed(1)}% affected, ${gt.lesion_count} lesions (${gt.severity}).`;

    images = d.images;
    const tabs = $("tabs");
    tabs.replaceChildren();
    for (const key of Object.keys(LABELS).filter((k) => images[k])) {
      const b = document.createElement("button");
      b.textContent = LABELS[key];
      b.onclick = () => show(key);
      b.dataset.key = key;
      tabs.append(b);
    }
    show("overlay");
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function show(key) {
    $("view").src = `data:image/png;base64,${images[key]}`;
    for (const b of $("tabs").children) b.setAttribute("aria-pressed", b.dataset.key === key);
  }

  $("camera").onchange = (e) => upload(e.target.files[0]);
  $("gallery").onchange = (e) => upload(e.target.files[0]);
  $("sample").onclick = sample;
</script>
</body>
</html>
